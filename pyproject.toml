[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carlitos-network"
version = "0.1.0"
description = "Carlitos Network (CRLTS) local devnet prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crlts = "carlitos.cli:main"

[tool.setuptools.packages.find]
include = ["carlitos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
