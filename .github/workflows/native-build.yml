name: Carlitos native C++ build

on:
  push:
    branches:
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake python3 libboost-dev libsqlite3-dev

      - name: Configure Bitcoin Core with Carlitos changes
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=OFF

      - name: Build node, CLI, and native test binaries
        run: cmake --build build --parallel 2

      - name: Run native C++ unit tests
        run: ctest --test-dir build --output-on-failure --parallel 2
