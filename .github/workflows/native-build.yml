name: Carlitos native build and consensus tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep one current validation run per PR/ref. This prevents push + PR events
# and rapid commits from building the same native tree repeatedly.
concurrency:
  group: carlitos-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build-and-consensus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config python3 libboost-dev libsqlite3-dev libevent-dev libssl-dev

      - name: Configure Carlitos
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=OFF

      - name: Build node, CLI, wallet, and native test binary
        run: cmake --build build --parallel 2

      - name: Verify generated Carlitos configuration example
        run: |
          EXAMPLE_CONF_FILE="$RUNNER_TEMP/carlitos.conf" \
          SHARE_EXAMPLES_DIR="$RUNNER_TEMP" \
          BITCOIND="$PWD/build/bin/bitcoind" \
            contrib/devtools/gen-bitcoin-conf.sh
          test -s "$RUNNER_TEMP/carlitos.conf"
          python3 - "$RUNNER_TEMP/carlitos.conf" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          generated = re.sub(r"[\s#]+", " ", path.read_text(encoding="utf-8"))
          expected = (
              "default: 28444",
              "carlitostestnet: 48444",
              "carlitosregtest: 38444",
              "default: 28446",
              "carlitostestnet: 48446",
              "carlitosregtest: 38446",
              "[carlitostestnet]",
              "[carlitosregtest]",
          )
          missing = [item for item in expected if item not in generated]
          if missing:
              print("Relevant generated configuration lines:")
              for line in path.read_text(encoding="utf-8").splitlines():
                  if any(term in line.lower() for term in ("carlitos", "28444", "28446", "38444", "38446", "48444", "48446")):
                      print(line)
              raise SystemExit(f"Generated carlitos.conf is missing: {missing}")
          print("Generated Carlitos P2P/RPC ports and network sections verified.")
          PY

      - name: Run Python reference consensus tests
        run: python3 -m unittest discover -s tests -v

      - name: Run targeted native consensus tests
        run: build/bin/test_bitcoin --run_test=validation_tests --log_level=message

      - name: Smoke test local node, wallet, mining, maturity, and transaction
        run: python3 tests/smoke_node.py

      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure
