name: Carlitos native build and consensus tests

on:
  push:
    branches:
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-build-and-consensus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake python3 libboost-dev libsqlite3-dev

      - name: Configure Carlitos
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=OFF

      - name: Build node, CLI, wallet, and native test binary
        run: cmake --build build --parallel 2

      - name: Run Python reference consensus tests
        run: python3 -m unittest discover -s tests -v

      - name: Run targeted native consensus tests
        run: build/bin/test_bitcoin --run_test=validation_tests --log_level=message

      - name: Smoke test local node, wallet, mining, maturity, and transaction
        run: python3 tests/smoke_node.py
